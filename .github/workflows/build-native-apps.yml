name: build-native-apps

on:
  push:
    branches: [codex/test-native-apps]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build native ARM64 applications
        run: nix build -L --no-link .#chatgpt-native .#antigravity-native
