name: test-charger-screen

on:
  push:
    branches: [codex/charger-screen-timeout]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build and test charger helper
        run: nix build -L --no-link .#sheng-charger-mode
