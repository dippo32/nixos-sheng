name: camera-awb-output-cache

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  export:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build and export the pinned output only
        shell: bash
        run: |
          set -euo pipefail
          commit='25a3fccc4eae024ff64d905f2dad72c161524812'
          ref="github:dippo32/nixos-sheng/$commit"
          attr='packages.aarch64-linux.libcamera-awb-test'
          remote_drv=$(nix eval --raw "$ref#$attr.drvPath")
          local_drv=$(nix eval --raw ".#$attr.drvPath")
          remote_out=$(nix eval --raw "$ref#$attr.outPath")
          local_out=$(nix eval --raw ".#$attr.outPath")
          test "$remote_drv" = "$local_drv"
          test "$remote_out" = "$local_out"
          nix build -L "$ref#libcamera-awb-test" -o result
          test "$(readlink -f result)" = "$remote_out"
          nix path-info "$remote_out" >/dev/null
          mkdir -p camera-awb-output
          printf '%s\n' "$commit" > camera-awb-output/source-commit.txt
          printf '%s\n' "$remote_drv" > camera-awb-output/derivation-path.txt
          printf '%s\n' "$remote_out" > camera-awb-output/output-path.txt
          nix-store --query --references "$remote_out" > camera-awb-output/references.txt
          nix-store --query --requisites "$remote_out" > camera-awb-output/closure.txt
          nix path-info --closure-size "$remote_out" > camera-awb-output/closure-size.txt
          readelf -d "$remote_out/bin/cam" > camera-awb-output/cam-dynamic.txt
          ldd "$remote_out/bin/cam" > camera-awb-output/cam-libraries.txt
          nix-store --export "$remote_out" | zstd -T0 -3 -o camera-awb-output/camera-awb-output.nar.zst
          (cd camera-awb-output && sha256sum camera-awb-output.nar.zst source-commit.txt derivation-path.txt output-path.txt references.txt closure.txt closure-size.txt cam-dynamic.txt cam-libraries.txt > SHA256SUMS)
      - name: Attest output and checksum manifest
        uses: actions/attest@v4
        with:
          subject-path: |
            camera-awb-output/camera-awb-output.nar.zst
            camera-awb-output/SHA256SUMS
      - name: Upload signed and checksummed output
        uses: actions/upload-artifact@v6
        with:
          name: camera-awb-output-pinned-25a3fcc
          path: camera-awb-output/
          if-no-files-found: error
          compression-level: 0
