name: build-personal-kde

on:
  # The first push can build this candidate before the workflow is on main.
  # Other branches and pull requests do not start this additional image build.
  push:
    branches: [codex/kde-personal-flatpak-power, codex/personal-dippo-apps]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore existing Nix store cache without saving or purging
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-aarch64-${{ runner.os }}-${{ hashFiles('flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-aarch64-${{ runner.os }}-
          save: false

      - name: Check desktop and accessory configuration
        run: |
          set -euo pipefail
          for check in desktop-images firmware-options personal-kde performance kernel-source personal-account generation-retention personal-removable-apps personal-rotation; do
            nix eval --json --impure --option allow-import-from-derivation false \
              --expr "import ./tests/$check.nix { flake = builtins.getFlake (\"git+file://\" + toString ./.); }"
          done
          python3 tests/generation-retention.py
          python3 tests/extlinux-generations.py
          bash tests/kernel-closure-cache.sh
          nix build --impure --no-link --expr '(import ./tests/personal-rotation.nix { flake = builtins.getFlake ("git+file://" + toString ./.); system = "aarch64-linux"; }).scriptTests'
          nix shell --inputs-from . nixpkgs#android-tools nixpkgs#e2fsprogs nixpkgs#zstd \
            -c python3 tests/private-image-provision.py

      - name: Build and test vendor helpers before the kernel
        run: nix build -L --no-link .#sheng-mipps-auth .#sheng-charger-mode .#fastrpc

      - name: Restore matching kernel closure from this fork or upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          kernel_ref='.#nixosConfigurations.sheng-kde-personal.config.boot.kernelPackages.kernel'
          outputs_json=$(nix eval --json "${kernel_ref}.outputs")
          # This profile is modular and needs the image, build tree and modules.
          printf '%s\n' "$outputs_json" | jq -e '
            type == "array" and
            all(.[]; type == "string" and test("^[a-zA-Z][a-zA-Z0-9_-]*$")) and
            (index("out") != null and index("dev") != null and index("modules") != null) and
            (length == (unique | length))' >/dev/null
          printf '%s\n' "$outputs_json" | jq -r '.[]' > "$RUNNER_TEMP/kernel-output-names.txt"
          : > "$RUNNER_TEMP/kernel-outputs.txt"
          kernel_paths=()
          kernel=''
          while IFS= read -r output; do
            path=$(nix eval --raw "${kernel_ref}.${output}.outPath")
            printf '%s\t%s\n' "$output" "$path" >> "$RUNNER_TEMP/kernel-outputs.txt"
            kernel_paths+=("$path")
            if [ "$output" = out ]; then kernel="$path"; fi
          done < "$RUNNER_TEMP/kernel-output-names.txt"
          all_present=true
          for path in "${kernel_paths[@]}"; do
            if ! nix path-info "$path" >/dev/null 2>&1; then all_present=false; break; fi
          done
          if $all_present; then
            echo "All selected kernel outputs are already in the store."
            exit 0
          fi
          partial_imported=false
          repositories=("$GITHUB_REPOSITORY")
          if [ "$GITHUB_REPOSITORY" != Murkiness4095/nixos-sheng ]; then
            repositories+=(Murkiness4095/nixos-sheng)
          fi
          for repository in "${repositories[@]}"; do
            if [ "$repository" = "$GITHUB_REPOSITORY" ]; then
              workflow=build-personal-kde.yml
              branches=("$GITHUB_REF_NAME")
              for fallback in codex/native-librewolf codex/upstream-kernel-audio codex/kde-personal-flatpak-power; do
                if [ "$GITHUB_REF_NAME" != "$fallback" ]; then
                  branches+=("$fallback")
                fi
              done
              # v4+ artifacts become available once uploaded, even when an
              # image build continues or subsequently fails. Search both
              # push and manually dispatched runs, excluding the current run.
              run_filter='.[] | select((.event == "push" or .event == "workflow_dispatch") and (.status == "in_progress" or (.status == "completed" and (.conclusion == "success" or .conclusion == "failure" or .conclusion == "cancelled")))) | .databaseId'
            else
              workflow=build.yml
              branches=(main)
              run_filter='.[] | select(.event == "push" and .status == "completed" and .conclusion == "success") | .databaseId'
            fi
            for branch in "${branches[@]}"; do
             if ! previous_runs=$(gh run list --repo "$repository" --workflow "$workflow" --branch "$branch" --limit 20 --json databaseId,event,status,conclusion --jq "$run_filter"); then
               echo "Kernel artifact discovery unavailable in $repository ($branch)."
               continue
             fi
             for previous in $previous_runs; do
              if [ "$repository" = "$GITHUB_REPOSITORY" ] && [ "$previous" = "$GITHUB_RUN_ID" ]; then
                continue
              fi
              if ! artifact=$(gh api "repos/$repository/actions/runs/$previous/artifacts?per_page=100" --jq '.artifacts[] | select(.name == "sheng-kernel-closure" and .expired == false and .size_in_bytes > 0) | .id'); then
                echo "Cannot inspect kernel artifacts in $repository run $previous."
                continue
              fi
              if [ -z "$artifact" ]; then
                echo "No kernel closure in $repository run $previous."
                continue
              fi
              seed="seed-kernel/${repository//\//-}/$previous"
              if ! gh run download "$previous" --repo "$repository" --name sheng-kernel-closure --dir "$seed"; then
                echo "Kernel closure download unavailable in $repository run $previous."
                continue
              fi
              if [ ! -f "$seed/kernel-path.txt" ] || [ "$(cat "$seed/kernel-path.txt")" != "$kernel" ]; then
                echo "Kernel closure in $repository run $previous does not match this configuration."
                continue
              fi
              if [ ! -f "$seed/SHA256SUMS" ] || ! grep -Eq '^[0-9a-f]{64}  sheng-kernel-closure\.nar\.zst$' "$seed/SHA256SUMS"; then
                echo "Kernel closure checksum is missing in $repository run $previous."
                continue
              fi
              if ! (cd "$seed" && sha256sum -c --strict SHA256SUMS); then
                echo "Kernel closure checksum failed in $repository run $previous."
                continue
              fi
              full_manifest=false
              if [ -f "$seed/kernel-outputs.txt" ]; then
                if ! grep -Eq '^[0-9a-f]{64}  kernel-outputs\.txt$' "$seed/SHA256SUMS" || ! cmp -s "$RUNNER_TEMP/kernel-outputs.txt" "$seed/kernel-outputs.txt"; then
                  echo "Kernel output manifest does not match in $repository run $previous."
                  continue
                fi
                full_manifest=true
              elif $partial_imported; then
                continue
              fi
              if ! zstd -dc "$seed/sheng-kernel-closure.nar.zst" | sudo "$(command -v nix-store)" --import | tee "$seed/imported-paths.txt" >/dev/null; then
                echo "Kernel closure import failed in $repository run $previous."
                continue
              fi
              if ! nix path-info "$kernel" >/dev/null 2>&1; then
                echo "Imported closure is missing the selected kernel image in $repository run $previous."
                continue
              fi
              all_present=true
              for path in "${kernel_paths[@]}"; do
                if ! nix path-info "$path" >/dev/null 2>&1; then all_present=false; break; fi
              done
              if $full_manifest && $all_present; then
                echo "Restored all matching kernel outputs from $repository run $previous."
                exit 0
              fi
              partial_imported=true
              echo "Imported a partial legacy or incomplete closure from $repository run $previous; continuing to look for all outputs."
             done
            done
          done
          echo "No matching accessible kernel closure; building from locked source on ARM64."

      - name: Build and export selected kernel closure
        run: |
          set -euo pipefail
          kernel_ref='.#nixosConfigurations.sheng-kde-personal.config.boot.kernelPackages.kernel'
          nix build -L "${kernel_ref}^*" -o result-kernel
          mkdir -p kernel-artifacts
          cp "$RUNNER_TEMP/kernel-outputs.txt" kernel-artifacts/kernel-outputs.txt
          kernel_paths=()
          while IFS=$'\t' read -r output path; do
            link="result-kernel-$output"
            if [ "$output" = out ]; then link=result-kernel; fi
            test "$(readlink -f "$link")" = "$path"
            kernel_paths+=("$path")
            if [ "$output" = out ]; then printf '%s\n' "$path" > kernel-artifacts/kernel-path.txt; fi
          done < kernel-artifacts/kernel-outputs.txt
          nix-store --query --requisites "${kernel_paths[@]}" > kernel-artifacts/store-paths.txt
          mapfile -t store_paths < kernel-artifacts/store-paths.txt
          nix-store --export "${store_paths[@]}" | zstd -T0 -3 -o kernel-artifacts/sheng-kernel-closure.nar.zst
          git rev-parse HEAD > kernel-artifacts/revision.txt
          cp flake.lock kernel-artifacts/flake.lock
          (cd kernel-artifacts && sha256sum sheng-kernel-closure.nar.zst kernel-outputs.txt kernel-path.txt > SHA256SUMS)

      - name: Upload kernel closure before building the image
        uses: actions/upload-artifact@v6
        with:
          name: sheng-kernel-closure
          if-no-files-found: error
          compression-level: 0
          path: kernel-artifacts/

      - name: Verify selected production kernel and PM diagnostics
        run: |
          set -euo pipefail
          # Reading the real kernel .config may build its generator. This is
          # deliberately after the kernel build and runs only on native ARM64.
          nix eval --json --impure --expr 'import ./tests/kernel-profile.nix { flake = builtins.getFlake ("git+file://" + toString ./.); }'
          nix build -L --no-link .#nixosConfigurations.sheng-kde-personal.config.boot.kernelPackages.kernel.src
          source=$(nix eval --raw .#nixosConfigurations.sheng-kde-personal.config.boot.kernelPackages.kernel.src.outPath)
          test -f "$source/drivers/gpu/drm/msm/dsi/dsi_host.c"
          test -d "$source/drivers/gpu/drm/msm/disp/dpu1"
          test -f "$source/drivers/gpu/drm/panel/panel-novatek-nt36532e.c"
          if grep -RE 'SHENG_(TRACE|PPS|SEQ|RD|PM|W |P |D |C:)' \
            "$source/drivers/gpu/drm/msm/dsi" \
            "$source/drivers/gpu/drm/msm/disp/dpu1" \
            "$source/drivers/gpu/drm/panel/panel-novatek-nt36532e.c"; then
            echo "Bring-up display instrumentation is still present in the production kernel source." >&2
            exit 1
          fi

      - name: Build and verify single-system U-Boot
        run: |
          set -euo pipefail
          nix build -L .#u-boot-personal -o result-uboot
          test -f result-uboot/boot.img
          size=$(stat -L -c %s result-uboot/boot.img)
          test "$size" -gt 0
          test "$size" -lt $((192 * 1024 * 1024))
          nix shell --inputs-from . nixpkgs#android-tools -c unpack_bootimg \
            --boot_img result-uboot/boot.img --out bootimg-unpacked | tee bootimg-info.txt
          grep -Fxq 'boot image header version: 2' bootimg-info.txt
          grep -Fq 'kernel load address: 0x00008000' bootimg-info.txt
          grep -Fq 'page size: 4096' bootimg-info.txt
          grep -Fq 'root=PARTLABEL=userdata' bootimg-info.txt

      - name: Build personal KDE single-system image only
        run: nix build -L .#nixos-kde-personal -o result-personal-kde

      - name: Verify sparse image and prepare checksummed artifact
        run: |
          set -euo pipefail
          img=result-personal-kde/sheng-rootfs.sparse.img
          test -s "$img"
          magic=$(od -An -tx1 -N4 "$img" | tr -d ' \n')
          test "$magic" = "3aff26ed"
          test "$(nix eval --raw .#nixosConfigurations.sheng-kde-personal.config.sheng.rootfs.partlabel)" = userdata
          mkdir -p personal-kde-artifacts
          cp result-uboot/boot.img personal-kde-artifacts/sheng-boot.img
          nix shell --inputs-from . nixpkgs#zstd -c zstd -T0 --long=27 -3 -f "$img" \
            -o personal-kde-artifacts/sheng-rootfs-kde-personal.sparse.img.zst
          git rev-parse HEAD > personal-kde-artifacts/revision.txt
          cp flake.lock personal-kde-artifacts/flake.lock
          nix eval --raw .#nixosConfigurations.sheng-kde-personal.config.system.build.toplevel.outPath > personal-kde-artifacts/system-path.txt
          nix eval --raw .#nixosConfigurations.sheng-kde-personal.config.boot.kernelPackages.kernel.outPath > personal-kde-artifacts/kernel-path.txt
          cp bootimg-info.txt personal-kde-artifacts/bootimg-info.txt
          printf '%s\n' \
            'Xiaomi Pad 6S Pro (sheng): personal KDE single-system candidate.' \
            'Target root partition: userdata. Installation erases existing userdata.' \
            'Keyboard/pen helpers disabled; Flatpak and Flathub included.' \
            'Plasma on-screen keyboard selected by default for touch input.' \
            'Production display path without added bring-up logging; ZSTD zram and basic file indexing.' \
            'Charger helper re-entry/enqueue fixes and staged PM diagnostics included.' \
            'Bring-up USB serial gadget disabled at boot; actual Type-C roles require device testing.' \
            'Direct-boot U-Boot; system generation links are retained for manual rollback.' \
            'Account: dippo / Dippo Shelan. Login is locked until private local credential provisioning.' \
            'Native LibreWolf is included; its privacy defaults are unchanged.' \
            'ChatGPT and Antigravity native packages are optional user-profile installs.' \
            'THIS IS AN UNPROVISIONED BASE. Provision the account privately before first normal boot.' \
            'Native desktop applications may be installed after login; the legacy Flatpak seed is optional.' \
            'Charger userspace is guarded; offline charger boot remains a separate opt-in test.' \
            'A successful build does not verify device suspend/resume or battery life.' \
            > personal-kde-artifacts/BUILD-INFO.txt
          (cd personal-kde-artifacts && sha256sum \
            sheng-boot.img sheng-rootfs-kde-personal.sparse.img.zst revision.txt \
            flake.lock system-path.txt kernel-path.txt bootimg-info.txt BUILD-INFO.txt \
            > SHA256SUMS)

      - name: Upload personal KDE single-system image
        uses: actions/upload-artifact@v6
        with:
          name: sheng-kde-personal-flashable
          if-no-files-found: error
          compression-level: 0
          path: personal-kde-artifacts/
