name: test-native-gui

on:
  push:
    branches: [codex/antigravity-native-app]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check personal desktop application configuration
        run: |
          set -euo pipefail
          nix eval --json --impure --option allow-import-from-derivation false \
            --expr 'import ./tests/personal-removable-apps.nix { flake = builtins.getFlake ("git+file://" + toString ./.); }'

      - name: Build native ARM64 GUI applications
        run: |
          set -euo pipefail
          nix build -L --no-link .#chatgpt-native .#antigravity-native
